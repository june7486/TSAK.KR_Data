<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>故 노경하 선배님 추모관 · QR 안내</title>
<style>
  :root{--purple:#2E1A47;--gold:#B8860B;--ink:#1F1A2E;--muted:#6E6A7C;}
  *{box-sizing:border-box;}
  body{
    margin:0;padding:26px 18px 40px;background:#F6F4FB;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',
      'Noto Sans KR','Malgun Gothic',sans-serif;
    display:flex;flex-direction:column;align-items:center;
  }
  .card{
    background:#fff;border-radius:20px;padding:30px 26px 26px;max-width:460px;width:100%;
    box-shadow:0 12px 40px rgba(46,26,71,.13);text-align:center;
    border-top:5px solid var(--gold);
  }
  .emblem{width:52px;height:52px;object-fit:contain;margin-bottom:10px;}
  .org{font-size:11.5px;letter-spacing:1.5px;color:var(--muted);font-weight:700;}
  h1{font-size:19px;margin:12px 0 4px;line-height:1.45;letter-spacing:-.3px;}
  .flower{font-size:22px;margin-bottom:2px;}
  .sub{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 18px;}
  .qr{width:100%;max-width:250px;display:block;margin:0 auto;border-radius:10px;}
  .scan{
    margin-top:14px;font-size:13.5px;font-weight:800;color:var(--purple);
    background:#F3EFFA;border-radius:999px;padding:9px 18px;display:inline-block;
  }
  .hint{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.75;}
  .url{
    margin-top:16px;font-size:10px;color:#9A96A8;word-break:break-all;
    background:#FAF9FD;border-radius:8px;padding:8px;line-height:1.5;
  }
  .foot{margin-top:22px;font-size:11px;color:var(--muted);}
  @media print{
    body{background:#fff;padding:0;display:block;}
    .card{box-shadow:none;border:1.5px solid #E0DCEA;margin:14mm auto;max-width:150mm;}
    .noprint{display:none;}
  }
  .noprint{
    margin-top:18px;font-size:12px;color:var(--muted);
  }
  .noprint button{
    border:1.5px solid var(--purple);background:#fff;color:var(--purple);
    border-radius:999px;padding:9px 20px;font-size:12.5px;font-weight:800;
    cursor:pointer;font-family:inherit;
  }
</style>
</head>
