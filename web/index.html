<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TSAK · 한국범스카우트 중앙회 인가자 통합 관리 애플리케이션">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TSAK 통합 앱">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TSAK 인가자 관리</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 앱 초기 로딩 중 브랜드 스플래시 (Flutter 첫 프레임 전까지 표시) */
    html, body { margin: 0; height: 100%; }
    #tsak-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px;
      background: linear-gradient(160deg, #5B2C8D 0%, #3a1a5e 100%);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont,
        'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      transition: opacity .45s ease;
    }
    #tsak-splash.hide { opacity: 0; pointer-events: none; }
    #tsak-splash img { width: 108px; height: 108px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }
    #tsak-splash .t { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
    #tsak-splash .s { font-size: 12px; opacity: .8; }
    #tsak-splash .slow {
      display: none; font-size: 11.5px; opacity: .75; margin-top: 2px;
      line-height: 1.5; max-width: 260px; text-align: center;
    }
    #tsak-splash.slow-on .slow { display: block; }
    #tsak-splash .bar {
      width: 168px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.22); overflow: hidden; margin-top: 4px;
    }
    #tsak-splash .bar > i {
      display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #FFC93C; animation: tsak-slide 1.1s ease-in-out infinite;
    }
    @keyframes tsak-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="tsak-splash">
    <img src="assets/assets/images/tsak_emblem.png" alt="TSAK">
    <div class="t">TSAK 한국범스카우트중앙회</div>
    <div class="bar"><i></i></div>
    <div class="s">안전하게 불러오는 중…</div>
    <!-- 오래 걸릴 때만 나타나는 안내 (도메인 호스팅 최초 접속 대비) -->
    <div class="slow">
      접속에 시간이 걸리고 있습니다.<br>
      최초 접속은 앱을 내려받는 과정이라 잠시 걸릴 수 있어요.<br>
      잠시 후에도 그대로면 새로고침(또는 홈으로 다시 접속)해 주세요.
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 엔진 첫 프레임 후 스플래시 제거
    (function () {
      var done = false;
      function hide() {
        if (done) return; done = true;
        var el = document.getElementById('tsak-splash');
        if (!el) return;
        el.classList.add('hide');
        setTimeout(function () { el && el.remove(); }, 500);
      }
      window.addEventListener('flutter-first-frame', hide);
      // 엔진 준비 완료(_flutter.loader) 후 안전장치
      setTimeout(hide, 20000);
      // 4.5초 넘게 로딩이 지속되면 '접속에 시간이 걸리고 있습니다' 안내 노출
      setTimeout(function () {
        var el = document.getElementById('tsak-splash');
        if (el) el.classList.add('slow-on');
      }, 4500);
    })();

    // 업데이트/캐시 정리 (단일 로직)
    //  (A) 옛 서비스워커가 낡은 main.dart.js 를 캐시에서 서빙하던 문제 → 1회성 해제
    //  (B) version.json 변경 감지 → 캐시 정리 후 1회 자동 새로고침
    //  '--pwa-strategy none' 으로 새 서비스워커는 등록하지 않는다.
    (function () {
      var ss = window.sessionStorage;
      function guarded() {
        try {
          if (ss.getItem('tsak_reloaded')) return false;
          ss.setItem('tsak_reloaded', '1');
        } catch (e) {}
        return true;
      }
      function clearCachesAndReload() {
        try {
          if ('caches' in window) {
            caches.keys()
              .then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              })
              .catch(function () {})
              .then(function () { location.reload(); });
          } else {
            location.reload();
          }
        } catch (e) { location.reload(); }
      }
      try {
        // (A) 옛 서비스워커 1회성 해제
        if ('serviceWorker' in navigator &&
            localStorage.getItem('tsak_sw_off') !== '1') {
          navigator.serviceWorker.getRegistrations()
            .then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }))
                .then(function () { return rs.length; });
            })
            .catch(function () { return 0; })
            .then(function (n) {
              try { localStorage.setItem('tsak_sw_off', '1'); } catch (e) {}
              if (n > 0 && guarded()) clearCachesAndReload();
            });
          return;
        }
        // (B) 새 버전 감지
        fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (v) {
            var cur = v && (v.version || v.build_id);
            if (!cur) return;
            var curS = String(cur).replace(/[^0-9]/g, '');
            var prev = null;
            try { prev = localStorage.getItem('tsak_app_version'); } catch (e) {}
            try { localStorage.setItem('tsak_app_version', String(curS)); } catch (e) {}
            if (prev && prev !== curS && guarded()) clearCachesAndReload();
          })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>
</body>
</html>
