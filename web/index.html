<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TSAK · 한국범스카우트 중앙회 인가자 통합 관리 애플리케이션">

  <!-- iOS meta tags & icons -->
  <!-- iOS(Safari)에서 '홈 화면에 추가' 시 전체화면 앱처럼 실행되게 하는 핵심 태그.
       apple-mobile-web-app-capable 이 없으면 주소창 있는 브라우저로만 열린다. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TSAK 인가자">
  <meta name="format-detection" content="telephone=no">
  <!-- 아이폰 홈 아이콘(180x180 권장). iOS 는 알파/투명 배경을 검게 채우므로
       불투명 배경 PNG 를 사용한다. -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TSAK 인가자 관리</title>
  <link rel="manifest" href="manifest.json">

  <!-- 카카오 우편번호(주소검색) API -->
  <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <!-- 성능: 첫 프레임을 앞당기는 리소스 힌트 -->
  <!-- (1) 엔진/스크립트 조기 발견 -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <!-- (2) 스플래시 로고 즉시 표시(경량본) -->
  <link rel="preload" href="tsak_emblem_splash.png" as="image">
  <!-- (3) 폰트(한글 + 아이콘)를 최우선 프리로드 —
         Flutter 는 첫 프레임 직전에야 폰트를 요청하므로, 여기서 미리 받아
         main.dart.js 와 병렬로 다운로드하면 첫 프레임이 크게 단축된다. -->
  <link rel="preload" href="assets/assets/fonts/NanumGothic-Regular-s.ttf"
        as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/NanumGothic-Bold-s.ttf"
        as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf"
        as="fetch" type="font/otf" crossorigin>
  <!-- (4) 캔버스킷 wasm 은 gstatic CDN(초경량 br 압축)에서 받는다.
         DNS/TLS 핸드셰이크를 미리 시작해 병렬 다운로드를 앞당긴다. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* (p.4·p.5) 한글 폰트 보강 — 번들 NanumGothic 을 웹 셸에도 등록하고,
       아이폰/안드로이드에서 공통으로 존재하는 시스템 한글 폰트를 우선순위로
       지정한다. 스플래시 등 DOM 텍스트의 한글 두부(□□) 깨짐을 방지한다. */
    @font-face {
      font-family: 'NanumGothic';
      src: url('assets/assets/fonts/NanumGothic-Regular-s.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'NanumGothic';
      src: url('assets/assets/fonts/NanumGothic-Bold-s.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    html, body {
      margin: 0; height: 100%;
      font-family: 'NanumGothic', -apple-system, BlinkMacSystemFont,
        'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic',
        system-ui, sans-serif;
    }
    /* 앱 초기 로딩 중 브랜드 스플래시 (Flutter 첫 프레임 전까지 표시) */
    #tsak-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px;
      background: linear-gradient(160deg, #5B2C8D 0%, #3a1a5e 100%);
      color: #fff; font-family: 'NanumGothic', -apple-system, BlinkMacSystemFont,
        'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      transition: opacity .45s ease;
    }
    #tsak-splash.hide { opacity: 0; pointer-events: none; }
    #tsak-splash img { width: 108px; height: 108px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }
    #tsak-splash .t { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
    #tsak-splash .s { font-size: 12px; opacity: .8; }
    #tsak-splash .slow {
      display: none; font-size: 11.5px; opacity: .75; margin-top: 2px;
      line-height: 1.5; max-width: 260px; text-align: center;
    }
    #tsak-splash.slow-on .slow { display: block; }
    #tsak-splash .bar {
      width: 168px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.22); overflow: hidden; margin-top: 4px;
    }
    #tsak-splash .bar > i {
      display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #FFC93C; animation: tsak-slide 1.1s ease-in-out infinite;
    }
    @keyframes tsak-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="tsak-splash">
    <img src="tsak_emblem_splash.png" alt="TSAK" width="108" height="108">
    <div class="t">TSAK 한국범스카우트중앙회</div>
    <div class="bar"><i></i></div>
    <div class="s">안전하게 불러오는 중…</div>
    <!-- 오래 걸릴 때만 나타나는 안내 (도메인 호스팅 최초 접속 대비) -->
    <div class="slow">
      접속에 시간이 걸리고 있습니다.<br>
      최초 접속은 내려받는 과정이라<br>
      시간이 소요 될 수 있습니다.<br>
      잠시 후에도 그대로면 새로고침<br>
      해주세요.
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // 카카오 우편번호 주소검색 브리지.
    //  - Flutter(Dart)에서 window.tsakOpenKakaoPostcode(cb) 를 호출하면
    //    카카오 팝업을 열고, 선택 결과를 cb({zonecode, address}) 로 돌려준다.
    //  - 취소/오류 시 cb(null) 을 호출한다.
    window.tsakOpenKakaoPostcode = function (cb) {
      try {
        if (!window.kakao || !window.kakao.Postcode) {
          // 스크립트가 아직 안 실렸으면 동적으로 로드 후 재시도
          var s = document.createElement('script');
          s.src = '//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
          s.onload = function () { window.tsakOpenKakaoPostcode(cb); };
          s.onerror = function () { cb(null); };
          document.head.appendChild(s);
          return;
        }
        new window.kakao.Postcode({
          width: 560,
          height: 680,
          oncomplete: function (data) {
            var addr = '';
            if (data.userSelectedType === 'R') {
              addr = data.roadAddress || '';
            } else {
              addr = data.jibunAddress || '';
            }
            if (!addr) addr = data.address || '';
            cb({ zonecode: data.zonecode || '', address: addr });
          },
          onclose: function () { /* 사용자가 닫음 — 콜백 없음 */ }
        }).open();
      } catch (e) {
        try { cb(null); } catch (_) {}
      }
    };
  </script>
  <script>
    // 카카오 지도 위치 선택 브리지 (행사기획 → 위치 지정).
    //  - Flutter(Dart)에서 window.tsakOpenKakaoMapPicker(opts, cb) 를 호출하면
    //    전체화면 지도를 열고, 사용자가 드래그/검색으로 위치를 정한 뒤
    //    cb({place, lat, lng, address}) 를 돌려준다. 취소 시 cb(null).
    //  - opts = {key, title, place, lat, lng}. key = JavaScript 앱키.
    window.tsakOpenKakaoMapPicker = function (opts, cb) {
      opts = opts || {};
      var key = opts.key || '';
      var title = opts.title || '';
      var seedPlace = opts.place || '';
      var seedLat = parseFloat(opts.lat);
      var seedLng = parseFloat(opts.lng);

      var finished = false;
      function done(v) {
        if (finished) return;      // 중복 콜백 방지
        finished = true;
        try { document.removeEventListener('keydown', onEsc); } catch (e) {}
        try { cb(v); } catch (e) {}
      }
      function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
      function onEsc(e) {
        if (e && (e.key === 'Escape' || e.keyCode === 27)) {
          try { var a = document.getElementById('tkp-wrap'); if (a) a.remove(); } catch (_) {}
          try { var b = document.getElementById('tkp-fallback'); if (b) b.remove(); } catch (_) {}
          done(null);
        }
      }
      document.addEventListener('keydown', onEsc);
      if (!key) { done(null); return; }

      // ---- 안전장치(fail-safe): 8초 안에 지도가 준비되지 않으면
      //      '지도 없이 닫을 수 있는' 폴백 화면을 띄운다(앱이 멈추는 것 방지).
      var ready = false;
      var guard = setTimeout(function () {
        if (ready || finished) return;
        buildFallback('카카오 지도를 불러오지 못했습니다.');
      }, 8000);

      function loadSdk(cb2, fail) {
        if (window.kakao && window.kakao.maps && window.kakao.maps.services) {
          cb2(); return;
        }
        // 이미 로드 시도 중이면 onerror/onload 를 기다린다.
        var s = document.createElement('script');
        s.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey='
          + encodeURIComponent(key) + '&libraries=services&autoload=false';
        s.onload = function () {
          try {
            if (window.kakao && window.kakao.maps && kakao.maps.load) {
              kakao.maps.load(function () { cb2(); });
            } else { cb2(); }
          } catch (e) { fail(); }
        };
        s.onerror = function () { fail(); };
        document.head.appendChild(s);
      }

      // 지도 없이 안전하게 닫을 수 있는 폴백 화면.
      function buildFallback(msg) {
        if (finished) return;
        try { removeAll(); } catch (e) {}
        var wrap = document.createElement('div');
        wrap.id = 'tkp-fallback';
        wrap.style.cssText = 'position:fixed;inset:0;z-index:2147483646;background:#fff;'
          + 'display:flex;flex-direction:column;align-items:center;justify-content:center;'
          + 'padding:24px;text-align:center;'
          + "font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;";
        wrap.innerHTML = '<div style="font-size:40px">🗺️</div>'
          + '<div style="font-size:16px;font-weight:800;margin:12px 0 6px">' + esc(msg) + '</div>'
          + '<div style="font-size:13px;color:#666;line-height:1.6;max-width:420px">'
          + '카카오 콘솔 → 내 애플리케이션 → [한국범스카우트중앙회] → 제품 설정 → 카카오맵 → '
          + "'카카오맵(로컬)'을 활성화(ON)하면 실제 카카오 지도가 표시됩니다.<br>"
          + '지금은 <b>무료 지도(OpenStreetMap)</b> 검색으로 위치를 지정하실 수 있습니다.</div>'
          + '<button id="tkp-fb-close" style="margin-top:18px;padding:12px 26px;border:0;'
          + 'border-radius:10px;background:#5B2C8D;color:#fff;font-weight:800;font-size:14px;'
          + 'cursor:pointer">확인 (닫기)</button>';
        document.body.appendChild(wrap);
        var b = document.getElementById('tkp-fb-close');
        if (b) b.onclick = function () { try { wrap.remove(); } catch (e) {} done(null); };
        if (b) b.focus();
      }

      function removeAll() {
        var a = document.getElementById('tkp-wrap');
        if (a) a.remove();
        var b = document.getElementById('tkp-fallback');
        if (b) b.remove();
      }

      function build() {
        ready = true;
        try { clearTimeout(guard); } catch (e) {}

        var wrap = document.createElement('div');
        wrap.id = 'tkp-wrap';
        wrap.style.cssText = 'position:fixed;inset:0;z-index:2147483646;background:#fff;'
          + 'display:flex;flex-direction:column;'
          + "font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;";

        var head = document.createElement('div');
        head.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 12px;'
          + 'background:#5B2C8D;color:#fff;flex:0 0 auto;';
        head.innerHTML = '<b style="font-size:15px">🗺️ 지도에서 위치 선택</b>'
          + '<span style="flex:1"></span>'
          + '<button id="tkp-close" style="background:transparent;border:0;color:#fff;'
          + 'font-size:20px;line-height:1;cursor:pointer">✕</button>';

        var bar = document.createElement('div');
        bar.style.cssText = 'display:flex;gap:6px;padding:8px 10px;background:#faf8ff;flex:0 0 auto;';
        bar.innerHTML = '<input id="tkp-q" placeholder="장소·주소 검색 (예: 부산 송정해수욕장)" '
          + 'style="flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:9px;font-size:14px">'
          + '<button id="tkp-go" style="padding:10px 16px;border:0;border-radius:9px;'
          + 'background:#5B2C8D;color:#fff;font-weight:800;font-size:14px;cursor:pointer">검색</button>';

        var mapDiv = document.createElement('div');
        mapDiv.id = 'tkp-map';
        mapDiv.style.cssText = 'flex:1 1 auto;min-height:200px;position:relative;background:#eef1f5;';

        var pin = document.createElement('div');
        pin.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);'
          + 'font-size:34px;pointer-events:none;z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))';
        pin.textContent = '📍';
        mapDiv.appendChild(pin);

        var info = document.createElement('div');
        info.id = 'tkp-info';
        info.style.cssText = 'flex:0 0 auto;padding:10px 12px;background:#fff;border-top:1px solid #eee;'
          + 'font-size:13px;color:#333;line-height:1.45;min-height:44px;';

        var foot = document.createElement('div');
        foot.style.cssText = 'display:flex;gap:8px;padding:10px 12px;background:#fff;flex:0 0 auto;';
        foot.innerHTML = '<button id="tkp-cancel" style="flex:1;padding:12px;border:1px solid #ddd;'
          + 'border-radius:10px;background:#fff;font-size:14px;cursor:pointer">취소</button>'
          + '<button id="tkp-ok" style="flex:2;padding:12px;border:0;border-radius:10px;'
          + 'background:#5B2C8D;color:#fff;font-weight:800;font-size:14px;cursor:pointer">이 위치로 지정</button>';

        wrap.appendChild(head);
        wrap.appendChild(bar);
        wrap.appendChild(mapDiv);
        wrap.appendChild(info);
        wrap.appendChild(foot);
        document.body.appendChild(wrap);

        function $id(x){ return document.getElementById(x); }

        // ★ 먼저 버튼부터 연결 — 지도 생성이 실패해도 반드시 닫을 수 있게.
        $id('tkp-cancel').onclick = function () { removeAll(); done(null); };
        $id('tkp-close').onclick = function () { removeAll(); done(null); };

        var map = null, marker = null;
        var cur = { place: seedPlace || '', lat: isFinite(seedLat) ? seedLat : 37.5665,
                    lng: isFinite(seedLng) ? seedLng : 126.9780, address: '' };
        function setInfo() {
          var el = $id('tkp-info');
          if (!el) return;
          el.innerHTML = '<b>' + esc(cur.place || '(이름 없음)') + '</b>'
            + '<br><span style="color:#777">' + esc(cur.address || '') + '</span>'
            + ' <span style="color:#aaa;font-size:11.5px">('
            + Number(cur.lat).toFixed(5) + ', ' + Number(cur.lng).toFixed(5) + ')</span>';
        }
        setInfo();

        // ★ 지도 생성은 try/catch 로 감싼다(실패해도 화면은 닫을 수 있게 유지).
        try {
          var center = new kakao.maps.LatLng(cur.lat, cur.lng);
          map = new kakao.maps.Map(mapDiv, { center: center, level: 3 });
          marker = new kakao.maps.Marker({ position: center, map: map });
          marker.setMap(map);
          kakao.maps.event.addListener(map, 'dragend', function () {
            var c = map.getCenter();
            cur.lat = c.getLat(); cur.lng = c.getLng();
            marker.setPosition(c); setInfo();
          });
        } catch (e) {
          map = null;
          var md = $id('tkp-map');
          if (md) md.innerHTML = '<div style="position:absolute;inset:0;display:flex;'
            + 'align-items:center;justify-content:center;color:#888;font-size:13px;text-align:center;padding:20px">'
            + '카카오 지도를 표시할 수 없습니다.<br>(카카오맵 서비스 활성화 필요)<br><br>'
            + '좌측 검색창 대신, 아래 취소 후 <b>무료 지도</b>로 위치를 지정하세요.</div>';
        }

        $id('tkp-ok').onclick = function () {
          var v = { place: cur.place || '', lat: Number(cur.lat).toFixed(6),
                    lng: Number(cur.lng).toFixed(6), address: cur.address || '' };
          removeAll(); done(v);
        };

        function applyPlace(p) {
          var la = parseFloat(p.y), ln = parseFloat(p.x);
          if (isFinite(la) && isFinite(ln)) { cur.lat = la; cur.lng = ln; }
          cur.place = p.place_name || p.address_name || cur.place;
          cur.address = p.road_address_name || p.address_name || '';
          if (map && window.kakao && kakao.maps) {
            try {
              var pos = new kakao.maps.LatLng(cur.lat, cur.lng);
              map.setCenter(pos);
              if (marker) marker.setPosition(pos);
            } catch (e) {}
          }
          setInfo();
        }
        function search() {
          var q = ($id('tkp-q').value || '').trim();
          if (!q) return;
          if (!map) {
            $id('tkp-info').innerHTML = '<span style="color:#c62828">지도가 없어 검색할 수 없습니다. '
              + '무료 지도 검색을 이용하세요.</span>';
            return;
          }
          $id('tkp-info').innerHTML = '<span style="color:#777">검색 중…</span>';
          try {
            var ps = new kakao.maps.services.Places();
            ps.keywordSearch(q, function (data, status) {
              if (status === kakao.maps.services.Status.OK && data && data[0]) {
                applyPlace(data[0]); return;
              }
              var gc = new kakao.maps.services.Geocoder();
              gc.addressSearch(q, function (res, st2) {
                if (st2 === kakao.maps.services.Status.OK && res && res[0]) {
                  applyPlace({ x: res[0].x, y: res[0].y, place_name: q,
                    address_name: res[0].address_name || '',
                    road_address_name: (res[0].road_address && res[0].road_address.address_name) || '' });
                } else {
                  setInfo();
                  alert('검색 결과가 없습니다. 다른 검색어로 시도해 보세요.');
                }
              });
            });
          } catch (e) {
            setInfo();
            alert('검색 중 오류가 발생했습니다. 무료 지도 검색을 이용하세요.');
          }
        }
        $id('tkp-go').onclick = search;
        $id('tkp-q').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') search();
        });
      }

      // SDK 로드 실패 → 안전한 폴백 화면(닫기 버튼 있음). 앱은 절대 멈추지 않는다.
      loadSdk(build, function () { clearTimeout(guard); buildFallback('카카오 지도를 불러오지 못했습니다.'); });
    };

  <script>
    // Flutter 엔진 첫 프레임 후 스플래시 제거
    (function () {
      var done = false;
      function hide() {
        if (done) return; done = true;
        var el = document.getElementById('tsak-splash');
        if (!el) return;
        el.classList.add('hide');
        setTimeout(function () { el && el.remove(); }, 500);
      }
      window.addEventListener('flutter-first-frame', hide);
      // 엔진 준비 완료(_flutter.loader) 후 안전장치
      setTimeout(hide, 20000);
      // 4.5초 넘게 로딩이 지속되면 '접속에 시간이 걸리고 있습니다' 안내 노출
      setTimeout(function () {
        var el = document.getElementById('tsak-splash');
        if (el) el.classList.add('slow-on');
      }, 4500);
    })();

    // 업데이트/캐시 정리 (단일 로직)
    //  (A) 옛 서비스워커가 낡은 main.dart.js 를 캐시에서 서빙하던 문제 → 1회성 해제
    //  (B) version.json 변경 감지 → 캐시 정리 후 1회 자동 새로고침
    //  '--pwa-strategy none' 으로 새 서비스워커는 등록하지 않는다.
    (function () {
      var ss = window.sessionStorage;
      function guarded() {
        try {
          if (ss.getItem('tsak_reloaded')) return false;
          ss.setItem('tsak_reloaded', '1');
        } catch (e) {}
        return true;
      }
      function clearCachesAndReload() {
        // 1) 폰트/앱코드를 HTTP 캐시까지 무시하고 강제로 다시 받는다(cache:'reload').
        //    → 옛 아이콘 폰트가 브라우저 캐시에 남아 픽토그램이 누락되는 문제 해결.
        var warm = [];
        try { warm.push(fetch('assets/fonts/MaterialIcons-Regular.otf', { cache: 'reload' })); } catch (e) {}
        try { warm.push(fetch('flutter_bootstrap.js', { cache: 'reload' })); } catch (e) {}
        try { warm.push(fetch('main.dart.js', { cache: 'reload' })); } catch (e) {}
        var after = function () {
          try {
            if ('caches' in window) {
              caches.keys()
                .then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                })
                .catch(function () {})
                .then(function () { location.reload(); });
            } else {
              location.reload();
            }
          } catch (e) { location.reload(); }
        };
        if (warm.length) {
          Promise.all(warm).catch(function () {}).then(after);
        } else {
          after();
        }

      function versionCheck() {
        // 새 버전 감지: 서버 version.json 과 마지막으로 연 앱 버전을 비교한다.
        //  값이 다르면 캐시(정적자산)를 지우고 새 버전을 다시 내려받는다.
        fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (v) {
            var cur = v && (v.version || v.build_id);
            if (!cur) return;
            var curS = String(cur).replace(/[^0-9]/g, '');
            var prev = null;
            try { prev = localStorage.getItem('tsak_app_version'); } catch (e) {}
            try { localStorage.setItem('tsak_app_version', String(curS)); } catch (e) {}
            if (prev && prev !== curS && guarded()) clearCachesAndReload();
          })
          .catch(function () {});
      }
      try {
        // (A) 옛 서비스워커 1회성 해제 (낡은 main.dart.js 서빙 차단)

            .catch(function () { return 0; })
            .then(function (n) {
              try { localStorage.setItem('tsak_sw_off', '1'); } catch (e) {}
              if (n > 0) {
                // 워커가 있었으면 캐시 정리 후 재로드(그 후 versionCheck 는 재로드된 문서에서 실행됨)
                if (guarded()) clearCachesAndReload();

              }
              versionCheck(); // 워커가 없으면 바로 버전 감지
            });
        } else {
          // (B) 새 버전 감지 — 서비스워커가 없어도 항상 실행
          versionCheck();
        }
      } catch (e) {}
    })();
  </script>
